// ======== 渲染 ========
const levelNames = {
  1: "L1 非铲子",
  2: "L2 铲子非金铲",
  3: "L3 金铲铲(无手工)",
  4: "L4 较优秀(有手工)",
  5: "L5 非常优秀"
};
const levelColors = { 1: "#ff4466", 2: "#ff8844", 3: "#44aaff", 4: "#44dd88", 5: "#FFD700" };
let currentFilter = "all";

function getImagePath(item) {
  return encodeURI(item.path + "/" + item.file);
}

function renderStats() {
  const bar = document.getElementById("statsBar");
  const total = reviewData.length;
  const passed = reviewData.filter(d => d.review.score >= 60).length;
  const avgScore = (reviewData.reduce((s, d) => s + d.review.score, 0) / total).toFixed(1);
  const excellent = reviewData.filter(d => d.review.score >= 90).length;
  const matchCount = reviewData.filter(d => d.review.level === d.actual_level).length;

  bar.innerHTML = `
    <div class="stat-item"><div class="num">${total}</div><div class="label">抽样数</div></div>
    <div class="stat-item"><div class="num">121</div><div class="label">图片总数</div></div>
    <div class="stat-item"><div class="num">${(total/121*100).toFixed(0)}%</div><div class="label">抽样率</div></div>
    <div class="stat-item"><div class="num">${passed}</div><div class="label">通过(≥60)</div></div>
    <div class="stat-item"><div class="num">${excellent}</div><div class="label">优秀(≥90)</div></div>
    <div class="stat-item"><div class="num">${avgScore}</div><div class="label">平均分</div></div>
    <div class="stat-item"><div class="num">${((matchCount/total)*100).toFixed(0)}%</div><div class="label">一致率</div></div>
  `;
}

function renderFilters() {
  const bar = document.getElementById("filterBar");
  const counts = { all: reviewData.length };
  for (let i = 1; i <= 5; i++) counts[i] = reviewData.filter(d => d.review.level === i).length;

  let html = `<button class="filter-btn active" onclick="setFilter('all')">全部 <span class="count">${counts.all}</span></button>`;
  for (let i = 1; i <= 5; i++) {
    html += `<button class="filter-btn" onclick="setFilter(${i})">${levelNames[i]} <span class="count">${counts[i]}</span></button>`;
  }
  html += `<button class="filter-btn" onclick="setFilter('pass')">✅ 通过 <span class="count">${reviewData.filter(d=>d.review.score>=60).length}</span></button>`;
  html += `<button class="filter-btn" onclick="setFilter('fail')">❌ 未通过 <span class="count">${reviewData.filter(d=>d.review.score<60).length}</span></button>`;
  html += `<button class="filter-btn" onclick="setFilter('mismatch')">⚠️ AI≠人工 <span class="count">${reviewData.filter(d=>d.review.level!==d.actual_level).length}</span></button>`;
  bar.innerHTML = html;
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  event.target.closest(".filter-btn").classList.add("active");
  renderCards();
}

function renderChart() {
  const chart = document.getElementById("barChart");
  const counts = {};
  for (let i = 1; i <= 5; i++) counts[i] = reviewData.filter(d => d.review.level === i).length;
  const maxCount = Math.max(...Object.values(counts), 1);

  chart.innerHTML = Object.entries(counts).map(([lv, cnt]) => `
    <div class="bar-group">
      <div class="bar level-${lv}" style="height: ${Math.max(8, (cnt/maxCount)*130)}px">
        <span class="bar-val" style="color:${levelColors[lv]}">${cnt}</span>
      </div>
      <div class="bar-label">${levelNames[lv]}</div>
    </div>
  `).join("");
}

function renderAccuracy() {
  const grid = document.getElementById("accGrid");
  const total = reviewData.length;
  const matchCount = reviewData.filter(d => d.review.level === d.actual_level).length;
  const passRate = reviewData.filter(d => d.review.score >= 60).length;
  const l5avg = reviewData.filter(d=>d.review.level===5);
  const l5score = l5avg.length ? (l5avg.reduce((s,d)=>s+d.review.score,0)/l5avg.length).toFixed(0) : '-';
  const l1avg = reviewData.filter(d=>d.review.level===1);
  const l1score = l1avg.length ? (l1avg.reduce((s,d)=>s+d.review.score,0)/l1avg.length).toFixed(0) : '-';
  const passItems = reviewData.filter(d=>d.review.level>=3);
  const passAvg = passItems.length ? (passItems.reduce((s,d)=>s+d.review.score,0)/passItems.length).toFixed(0) : '-';
  const scoreRange = Math.max(...reviewData.map(d=>d.review.score)) - Math.min(...reviewData.map(d=>d.review.score));

  grid.innerHTML = `
    <div class="acc-item"><div class="big">${((matchCount/total)*100).toFixed(0)}%</div><div class="desc">AI vs 人工一致率</div></div>
    <div class="acc-item"><div class="big">${((passRate/total)*100).toFixed(0)}%</div><div class="desc">通过率(≥60)</div></div>
    <div class="acc-item"><div class="big">${l5score}</div><div class="desc">L5 平均分</div></div>
    <div class="acc-item"><div class="big">${l1score}</div><div class="desc">L1 平均分</div></div>
    <div class="acc-item"><div class="big">${passAvg}</div><div class="desc">金铲铲(L3+)均分</div></div>
    <div class="acc-item"><div class="big">${scoreRange}</div><div class="desc">分数跨度</div></div>
  `;
}

function renderConfMatrix() {
  const table = document.getElementById("confMatrix");
  // 行=人工分类, 列=AI评级
  const matrix = {};
  for (let a = 1; a <= 5; a++) {
    matrix[a] = {};
    for (let p = 1; p <= 5; p++) matrix[a][p] = 0;
  }
  reviewData.forEach(d => {
    matrix[d.actual_level][d.review.level]++;
  });

  let html = '<tr><th>人工↓ / AI→</th>';
  for (let p = 1; p <= 5; p++) html += `<th style="color:${levelColors[p]}">L${p}</th>`;
  html += '<th>合计</th></tr>';

  for (let a = 1; a <= 5; a++) {
    html += `<tr><th style="color:${levelColors[a]}">L${a}</th>`;
    let rowSum = 0;
    for (let p = 1; p <= 5; p++) {
      const v = matrix[a][p];
      rowSum += v;
      const cls = a === p ? 'match-cell' : (v > 0 ? 'mismatch-cell' : '');
      html += `<td class="${cls}">${v || '-'}</td>`;
    }
    html += `<td>${rowSum}</td></tr>`;
  }
  table.innerHTML = html;
}

function renderCards() {
  const grid = document.getElementById("cardGrid");
  let data = reviewData;
  if (currentFilter !== "all") {
    if (currentFilter === "pass") data = reviewData.filter(d => d.review.score >= 60);
    else if (currentFilter === "fail") data = reviewData.filter(d => d.review.score < 60);
    else if (currentFilter === "mismatch") data = reviewData.filter(d => d.review.level !== d.actual_level);
    else data = reviewData.filter(d => d.review.level === currentFilter);
  }

  grid.innerHTML = data.map((item) => {
    const idx = reviewData.indexOf(item);
    const match = item.review.level === item.actual_level;
    return `
    <div class="card" onclick="openModal(${idx})">
      <div class="card-img-wrap">
        <img src="${getImagePath(item)}" alt="${item.file}" loading="lazy"
             onerror="this.style.display='none'; this.parentNode.innerHTML += '<div style=\\"display:flex;align-items:center;justify-content:center;height:100%;color:#666;font-size:13px;flex-direction:column\\"><div style=\\"font-size:32px;margin-bottom:8px\\">🖼️</div>图片加载失败<br><small>${item.file.split('.').pop().toUpperCase()} 格式</small></div>'" />
        <div class="card-badge level-${item.review.level}">${levelNames[item.review.level]}</div>
        <div class="card-score score-l${item.review.level}">${item.review.score}</div>
        <div class="card-match ${match ? 'correct' : 'wrong'}">${match ? '✓ AI=人工' : '⚠ AI≠人工(实际L'+item.actual_level+')'}</div>
      </div>
      <div class="card-body">
        <div class="comment">${item.review.comment}</div>
        <div class="meta">
          <span class="category">${item.category.replace(/_/g, ' ')}</span>
          <span>${item.review.is_shovel ? '🔨 是铲子' : '❌ 非铲子'}</span>
        </div>
      </div>
    </div>`;
  }).join("");
}

function openModal(idx) {
  const item = reviewData[idx];
  const modal = document.getElementById("modal");
  const content = document.getElementById("modalContent");
  const match = item.review.level === item.actual_level;

  content.innerHTML = `
    <img class="modal-img" src="${getImagePath(item)}" alt="${item.file}"
         onerror="this.outerHTML='<div style=\\"height:200px;display:flex;align-items:center;justify-content:center;background:#080812;color:#666;font-size:15px;border-radius:16px 16px 0 0\\">🖼️ 图片无法显示 (${item.file.split('.').pop().toUpperCase()})</div>'" />
    <div class="modal-body">
      <h3>
        <span class="card-badge level-${item.review.level}" style="position:static;margin-right:8px;font-size:13px">${levelNames[item.review.level]}</span>
        ${item.review.score} 分
        <span style="margin-left:12px;font-size:13px;padding:3px 10px;border-radius:6px;${match ? 'background:rgba(68,221,136,0.15);color:#44dd88' : 'background:rgba(255,68,102,0.15);color:#ff4466'}">${match ? '✓ 评级一致' : '⚠ 评级不一致 (人工:L'+item.actual_level+')'}</span>
      </h3>
      <div class="detail-row"><span class="detail-label">文件名</span><span style="word-break:break-all">${item.file}</span></div>
      <div class="detail-row"><span class="detail-label">人工分类</span><span>L${item.actual_level} - ${levelNames[item.actual_level]}</span></div>
      <div class="detail-row"><span class="detail-label">AI 评级</span><span>L${item.review.level} - ${levelNames[item.review.level]}</span></div>
      <div class="detail-row"><span class="detail-label">是否铲子</span><span>${item.review.is_shovel ? '✅ 是铲子' : '❌ 不是铲子'}</span></div>
      <div class="detail-row"><span class="detail-label">AI 评语</span><span>${item.review.comment}</span></div>
      <div class="reasoning">
        <strong>📋 VLM 判断依据</strong><br>
        ${item.review.reasoning}
      </div>
      <div style="margin-top:16px">
        <strong>📦 JSON 输出</strong>
        <pre style="background:rgba(255,255,255,0.03);padding:12px;border-radius:8px;font-size:11px;overflow-x:auto;margin-top:8px;border:1px solid var(--border)">${JSON.stringify(item.review, null, 2)}</pre>
      </div>
    </div>
  `;
  modal.classList.add("show");
}

function closeModal() {
  document.getElementById("modal").classList.remove("show");
}

document.getElementById("modal").addEventListener("click", (e) => {
  if (e.target === document.getElementById("modal")) closeModal();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

// Init
renderStats();
renderFilters();
renderChart();
renderAccuracy();
renderConfMatrix();
renderCards();
</script>
</body>
</html>
