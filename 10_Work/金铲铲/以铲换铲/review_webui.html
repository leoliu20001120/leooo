// ======== 渲染逻辑 ========
const levelNames = {
  1: "L1 非铲子",
  2: "L2 铲子非金铲",
  3: "L3 金铲铲(无手工)",
  4: "L4 较优秀(有手工)",
  5: "L5 非常优秀"
};

const levelColors = {
  1: "#ff4444",
  2: "#ff8844",
  3: "#44aaff",
  4: "#44dd88",
  5: "#FFD700"
};

let currentFilter = "all";

function getImagePath(item) {
  const ext = item.file.split('.').pop().toLowerCase();
  if (ext === 'avif' || ext === 'webp') {
    // avif/webp 已预转换为 _converted.jpg 以确保浏览器兼容性
    const base = item.file.substring(0, item.file.lastIndexOf('.'));
    return encodeURI(item.path + "/" + base + "_converted.jpg");
  }
  return encodeURI(item.path + "/" + item.file);
}

function renderStats() {
  const bar = document.getElementById("statsBar");
  const total = reviewData.length;
  const passed = reviewData.filter(d => d.review.score >= 60).length;
  const avgScore = (reviewData.reduce((s, d) => s + d.review.score, 0) / total).toFixed(1);
  const excellent = reviewData.filter(d => d.review.score >= 90).length;

  bar.innerHTML = `
    <div class="stat-item"><div class="num">${total}</div><div class="label">抽样总数</div></div>
    <div class="stat-item"><div class="num">121</div><div class="label">图片总数</div></div>
    <div class="stat-item"><div class="num">${passed}</div><div class="label">通过(≥60)</div></div>
    <div class="stat-item"><div class="num">${excellent}</div><div class="label">优秀(≥90)</div></div>
    <div class="stat-item"><div class="num">${avgScore}</div><div class="label">平均分</div></div>
    <div class="stat-item"><div class="num">${((total/121)*100).toFixed(0)}%</div><div class="label">抽样率</div></div>
  `;
}

function renderFilters() {
  const bar = document.getElementById("filterBar");
  const counts = { all: reviewData.length };
  for (let i = 1; i <= 5; i++) {
    counts[i] = reviewData.filter(d => d.review.level === i).length;
  }

  let html = `<button class="filter-btn active" onclick="setFilter('all')">全部 <span class="count">${counts.all}</span></button>`;
  for (let i = 1; i <= 5; i++) {
    html += `<button class="filter-btn" onclick="setFilter(${i})">${levelNames[i]} <span class="count">${counts[i]}</span></button>`;
  }
  html += `<button class="filter-btn" onclick="setFilter('pass')">✅ 通过 <span class="count">${reviewData.filter(d=>d.review.score>=60).length}</span></button>`;
  html += `<button class="filter-btn" onclick="setFilter('fail')">❌ 未通过 <span class="count">${reviewData.filter(d=>d.review.score<60).length}</span></button>`;
  bar.innerHTML = html;
}

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
  event.target.closest(".filter-btn").classList.add("active");
  renderCards();
}

function renderCards() {
  const grid = document.getElementById("cardGrid");
  let data = reviewData;
  if (currentFilter !== "all") {
    if (currentFilter === "pass") data = reviewData.filter(d => d.review.score >= 60);
    else if (currentFilter === "fail") data = reviewData.filter(d => d.review.score < 60);
    else data = reviewData.filter(d => d.review.level === currentFilter);
  }

  grid.innerHTML = data.map((item, idx) => `
    <div class="card" onclick="openModal(${reviewData.indexOf(item)})">
      <div class="card-img-wrap">
        <img src="${getImagePath(item)}" alt="${item.file}" loading="lazy"
             onerror="this.style.display='none'; this.parentNode.innerHTML += '<div style=\\"display:flex;align-items:center;justify-content:center;height:100%;color:#666;font-size:14px\\">⚠️ 图片加载失败<br>(${item.file.split('.').pop().toUpperCase()}格式)</div>'" />
        <div class="card-badge level-${item.review.level}">${levelNames[item.review.level]}</div>
        <div class="card-score score-l${item.review.level}">${item.review.score}</div>
      </div>
      <div class="card-body">
        <div class="comment">${item.review.comment}</div>
        <div class="meta">
          <span class="category">${item.category.replace(/_/g, ' ')}</span>
          <span class="is-shovel">${item.review.is_shovel ? '🔨 是铲子' : '❌ 非铲子'}</span>
        </div>
      </div>
    </div>
  `).join("");
}

function renderChart() {
  const chart = document.getElementById("barChart");
  const counts = {};
  for (let i = 1; i <= 5; i++) counts[i] = reviewData.filter(d => d.review.level === i).length;
  const maxCount = Math.max(...Object.values(counts));

  chart.innerHTML = Object.entries(counts).map(([level, count]) => `
    <div class="bar-group">
      <div class="bar level-${level}" style="height: ${Math.max(10, (count/maxCount)*160)}px">
        <span class="bar-val" style="color:${levelColors[level]}">${count}</span>
      </div>
      <div class="bar-label">${levelNames[level]}</div>
    </div>
  `).join("");
}

function renderAccuracy() {
  const grid = document.getElementById("accuracyGrid");
  const total = reviewData.length;
  // 评审等级与实际分类一致的数量
  const match = reviewData.filter(d => d.review.level === d.actual_level).length;
  const passRate = reviewData.filter(d => d.review.score >= 60).length;
  const avgByLevel = {};
  for (let i = 1; i <= 5; i++) {
    const items = reviewData.filter(d => d.review.level === i);
    avgByLevel[i] = items.length ? (items.reduce((s, d) => s + d.review.score, 0) / items.length).toFixed(0) : 0;
  }

  grid.innerHTML = `
    <div class="accuracy-card">
      <h4>评审一致率</h4>
      <div class="big-num">${((match/total)*100).toFixed(1)}%</div>
      <div class="desc">AI评级 vs 人工分类一致 (${match}/${total})</div>
    </div>
    <div class="accuracy-card">
      <h4>通过率 (≥60分)</h4>
      <div class="big-num">${((passRate/total)*100).toFixed(1)}%</div>
      <div class="desc">${passRate} 张通过 / ${total-passRate} 张未通过</div>
    </div>
    <div class="accuracy-card">
      <h4>L5 平均分</h4>
      <div class="big-num">${avgByLevel[5]}</div>
      <div class="desc">优秀金铲铲 (强手工+高创意)</div>
    </div>
    <div class="accuracy-card">
      <h4>L1 平均分</h4>
      <div class="big-num">${avgByLevel[1]}</div>
      <div class="desc">非铲子类 (应被明确拒绝)</div>
    </div>
    <div class="accuracy-card">
      <h4>L3-L5 平均分</h4>
      <div class="big-num">${(reviewData.filter(d=>d.review.level>=3).reduce((s,d)=>s+d.review.score,0) / reviewData.filter(d=>d.review.level>=3).length).toFixed(0)}</div>
      <div class="desc">符合金铲铲的作品平均质量</div>
    </div>
  `;
}

function openModal(idx) {
  const item = reviewData[idx];
  const modal = document.getElementById("modal");
  const content = document.getElementById("modalContent");

  content.innerHTML = `
    <img class="modal-img" src="${getImagePath(item)}" alt="${item.file}"
         onerror="this.style.height='200px'; this.style.display='flex'; this.outerHTML='<div style=\\"height:200px;display:flex;align-items:center;justify-content:center;background:#111;color:#666;font-size:16px;border-radius:16px 16px 0 0\\">⚠️ 图片无法显示 (${item.file.split('.').pop().toUpperCase()}格式)</div>'" />
    <div class="modal-body">
      <h3>
        <span class="card-badge level-${item.review.level}" style="position:static;margin-right:8px">${levelNames[item.review.level]}</span>
        ${item.review.score} 分
      </h3>
      <div class="detail-row"><span class="detail-label">文件名</span><span>${item.file}</span></div>
      <div class="detail-row"><span class="detail-label">所属分类</span><span>${item.category.replace(/_/g, ' ')}</span></div>
      <div class="detail-row"><span class="detail-label">是否铲子</span><span>${item.review.is_shovel ? '✅ 是铲子' : '❌ 不是铲子'}</span></div>
      <div class="detail-row"><span class="detail-label">AI 评语</span><span>${item.review.comment}</span></div>
      <div class="reasoning">
        <strong>📋 判断依据（内部参考）</strong><br>
        ${item.review.reasoning}
      </div>
      <div style="margin-top:16px">
        <strong>📦 JSON 输出</strong>
        <pre style="background:rgba(255,255,255,0.04);padding:12px;border-radius:8px;font-size:12px;overflow-x:auto;margin-top:8px">${JSON.stringify(item.review, null, 2)}</pre>
      </div>
    </div>
  `;

  modal.classList.add("show");
}

function closeModal() {
  document.getElementById("modal").classList.remove("show");
}

document.getElementById("modal").addEventListener("click", (e) => {
  if (e.target === document.getElementById("modal")) closeModal();
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeModal();
});

// Init
renderStats();
renderFilters();
renderChart();
renderAccuracy();
renderCards();
</script>
