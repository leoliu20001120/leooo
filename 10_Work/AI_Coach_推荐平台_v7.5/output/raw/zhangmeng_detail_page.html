    <script>
      /**
       * 比较两个版本号字符串的大小
       * @param {string} v1 - 版本号字符串，例如 "12.0.0.110"
       * @param {string} v2 - 版本号字符串，例如 "12.0.1"
       * @returns {number} 如果 v1 > v2 返回 1，v1 < v2 返回 -1，v1 == v2 返回 0
       */
      function compareVersion(v1, v2) {
        const arr1 = v1.split('.').map(Number);
        const arr2 = v2.split('.').map(Number);
        const len = Math.max(arr1.length, arr2.length);
    
        for (let i = 0; i < len; i++) {
          const num1 = i < arr1.length ? arr1[i] : 0;
          const num2 = i < arr2.length ? arr2[i] : 0;
          if (num1 > num2) return 1;
          if (num1 < num2) return -1;
        }
        return 0;
      }
    
      /**
       * 检测用户代理(UA)是否包含Harmony标识
       * 当存在时，在所有类名为g-app的元素中加入类名g-app-hm-adapt
       */
      function adaptForHarmony() {
        /** 获取用户代理字符串 */
        const UA = navigator.userAgent;
        /** 使用正则表达式不区分大小写匹配Harmony */
        const isHarmony = /harmony/i.test(UA);
    
        /** 获取版本号 */
        const version = UA.match(/lolapp\/([\d.]+)/)?.[1] || '0.0.0';
    
        /** 如果版本号大于12.0.0则不进行适配 */
        if (compareVersion(version, '12.0.0') > 0) return;
    
        /** 如果不是Harmony环境则直接返回 */
        if (!isHarmony) return;
    
        /** 获取所有g-app元素 */
        const appElements = [document.body];
    
        /** 如果没有找到g-app元素则发出警告并返回 */
        if (appElements.length === 0) {
          console.warn('未找到 .g-app 元素');
          return;
        }
    
        /** 如果找到多个g-app元素则发出警告 */
        if (appElements.length > 1) {
          console.warn('找到多个 .g-app 元素，将为所有元素添加类名');
        }
    
        /** 为所有g-app元素添加适配类名 */
        Array.from(appElements).forEach((el) => {
          el.classList.add('g-app-hm-adapt');
        });
      }
    
      /**
       * 文档加载完成后执行回调函数
       * @param {Function} fn - 要执行的回调函数
       */
      function whenReady(fn) {
        /** 如果文档已加载完成则立即执行 */
        if (document.readyState !== 'loading') {
          fn();
        } else {
          /** 否则添加DOMContentLoaded事件监听 */
          document.addEventListener('DOMContentLoaded', fn);
        }
      }
    
      /** 在文档就绪时执行Harmony适配检测 */
      whenReady(adaptForHarmony);
    </script>
